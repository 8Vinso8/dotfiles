# ALSA hardware headroom and power-saving overrides:
# - api.alsa.period-size = 1024: standard aligned period size.
# - api.alsa.headroom = 2048: safe DMA buffer margin preventing xruns/crackles.
# - session.suspend-timeout-seconds = 0: disables node suspension to stop sleep/wake clicks.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size            = 1024
        api.alsa.headroom               = 2048
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
