# Lock default and minimum quantum to 1024 samples (21.3ms at 48kHz).
# Prevents background streams from requesting tiny buffers (e.g. 512),
# eliminating audio crackles and buffer underruns (xruns) on Realtek ALC codecs.
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
}
